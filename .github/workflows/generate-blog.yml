name: Generate Programmatic SEO Blog Post

on:
  schedule:
    # Runs at 09:00 UTC on Mondays, Wednesdays, and Fridays
    - cron: '0 9 * * 1,3,5'
  
  # Allows you to trigger this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      track:
        description: 'Track to generate: automation or ecosystem'
        required: false
        default: 'automation'

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run DeepSeek Blog Generator
        env:
          # Optional: Use GitHub Secrets, but the script falls back to your local key
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.track }}" != "" ]; then
            node scripts/generate-daily-blog.mjs --track=${{ github.event.inputs.track }}
          else
            # Alternate tracks randomly if running via CRON
            if [ $((RANDOM % 2)) -eq 0 ]; then
              node scripts/generate-daily-blog.mjs --track=automation
            else
              node scripts/generate-daily-blog.mjs --track=ecosystem
            fi
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if there are any new markdown files generated in the content folder
          if [[ -n $(git status -s content/blogs/) ]]; then
            git add content/blogs/
            git commit -m "docs(blog): auto-generate programmatic SEO blog via DeepSeek [skip ci]"
            git push
            echo "Successfully committed new blog post!"
          else
            echo "No new blog posts were generated."
          fi
